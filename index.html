<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liga dos Centos 🥟</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#121521;color:#f6f6f8}main{max-width:860px;margin:auto;padding:30px 16px}header{text-align:center;padding:12px 0 25px}h1{color:#ffb54d;font-size:clamp(2rem,6vw,3.4rem);margin:0}p{color:#aeb3c4}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}.stat,.person,.panel{background:#222637;border:1px solid #353a4f;border-radius:15px;padding:17px}.stat{text-align:center}.stat strong{font-size:2.4rem;color:#ffb54d;display:block}.stat small{color:#c5c7d1}.panel{margin-bottom:20px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.person{display:flex;align-items:center;gap:12px;margin:10px 0}.medal{font-size:1.8rem;min-width:36px}.details{flex:1;min-width:0}.details strong{display:block;overflow-wrap:anywhere}.details small{color:#aeb3c4}.count{color:#ffb54d;font-size:1.5rem;font-weight:800;min-width:30px;text-align:right}.controls{display:flex;gap:6px;align-items:center}button{background:#41475d;color:white;border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:wait}.plus{background:#238454}.danger{background:#813844}input{background:#151929;color:white;border:1px solid #50566c;border-radius:9px;padding:12px;font-size:1rem;min-width:0}form{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}form input{flex:1}#notice{min-height:24px;color:#ffca76;margin:10px 0}.hidden{display:none!important}footer{text-align:center;color:#8c92a5;font-size:.85rem;padding:20px}#loginForm{margin-top:10px}@media(max-width:520px){.person{flex-wrap:wrap}.controls{margin-left:auto}.count{margin-left:auto}}
</style></head><body><main>
<header><h1>🥟 Liga dos Centos</h1><p>Quem ajuda, cobra. Quem deve, paga em salgados!</p></header>
<div class="stats"><div class="stat"><strong id="total">0</strong><small>Centos pendentes</small></div><div class="stat"><strong id="people">0</strong><small>Devedores</small></div></div>
<section class="panel"><div class="toolbar"><strong>🏆 Ranking dos devedores</strong><button id="loginToggle">🔐 Área administrativa</button></div>
<div id="authPanel" class="hidden"><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Seu e-mail" required><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha" required><button type="submit">Entrar</button></form><div id="signedIn" class="hidden"><p>Você está autenticado. Os controles de edição aparecem abaixo.</p><button id="logout">Sair</button></div></div>
<div id="notice" role="status" aria-live="polite"></div></section>
<section id="adminPanel" class="panel hidden"><strong>Adicionar devedor</strong><form id="addForm"><input id="name" maxlength="80" placeholder="Nome da pessoa" required><button class="plus" type="submit">+ Adicionar</button></form></section>
<div id="ranking"><p>Carregando placar...</p></div><footer>1 cento = 100 salgados • Placar atualizado automaticamente</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let db=null,rows=[],session=null,busy=false,channel=null;
const notify=msg=>{$('notice').textContent=msg};
const configured=window.SUPABASE_URL?.startsWith('https://')&&!window.SUPABASE_URL.includes('SEU-PROJETO')&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_ANON_KEY.startsWith('SUA_');
if(!configured||!window.supabase){notify('Configure o Supabase no arquivo config.js para ativar o placar.');$('ranking').replaceChildren();return}
db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function render(){const ordered=[...rows].sort((a,b)=>b.centos-a.centos||a.nome.localeCompare(b.nome,'pt-BR'));$('total').textContent=rows.reduce((n,r)=>n+r.centos,0).toLocaleString('pt-BR');$('people').textContent=rows.filter(r=>r.centos>0).length;const rank=$('ranking');rank.replaceChildren();if(!ordered.length){const p=document.createElement('p');p.textContent='Ainda não há devedores cadastrados.';rank.append(p)}ordered.forEach((r,i)=>{const card=document.createElement('article');card.className='person';const medal=document.createElement('span');medal.className='medal';medal.textContent=['🥇','🥈','🥉'][i]||'🥟';const details=document.createElement('div');details.className='details';const title=document.createElement('strong');title.textContent=r.nome;const small=document.createElement('small');small.textContent=`${(r.centos*100).toLocaleString('pt-BR')} salgados a pagar`;details.append(title,small);const count=document.createElement('span');count.className='count';count.textContent=r.centos;card.append(medal,details,count);if(session){const controls=document.createElement('div');controls.className='controls';for(const [label,delta,cls] of [['−',-1,''],['+',1,'plus']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.title=delta>0?'Adicionar um cento':'Quitar um cento';b.disabled=busy||(delta<0&&r.centos===0);b.addEventListener('click',()=>change(r,delta));controls.append(b)}const del=document.createElement('button');del.textContent='×';del.title='Excluir pessoa';del.className='danger';del.disabled=busy;del.addEventListener('click',()=>remove(r));controls.append(del);card.append(controls)}rank.append(card)})}
async function refresh(){const {data,error}=await db.from('dividas_salgados').select('id,nome,centos,criado_em').order('criado_em',{ascending:true});if(error){notify('Erro ao carregar placar: '+error.message);return}rows=data||[];render()}
async function work(fn){if(busy)return;busy=true;render();try{await fn()}catch(e){notify(e.message||'Não foi possível concluir a operação.')}finally{busy=false;await refresh()}}
async function change(r,delta){await work(async()=>{const next=r.centos+delta;if(next<0)return;const {data,error}=await db.from('dividas_salgados').update({centos:next}).eq('id',r.id).eq('centos',r.centos).select('id');if(error)throw error;if(!data.length)throw Error('O valor mudou em outro dispositivo. Placar atualizado; tente novamente.');notify(`${r.nome}: ${next} cento(s).`)})}
async function remove(r){if(!confirm(`Excluir ${r.nome} do placar?`))return;await work(async()=>{const {error}=await db.from('dividas_salgados').delete().eq('id',r.id);if(error)throw error;notify('Pessoa excluída.')})}
$('addForm').addEventListener('submit',e=>{e.preventDefault();const nome=$('name').value.trim();if(!nome)return;work(async()=>{const {error}=await db.from('dividas_salgados').insert({nome,centos:1});if(error)throw error;$('name').value='';notify('Pessoa adicionada com 1 cento de dívida.')})});
$('loginToggle').addEventListener('click',()=>{$('authPanel').classList.toggle('hidden')});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)notify('Não foi possível entrar: '+error.message);else{$('password').value='';notify('Login realizado.')}});
$('logout').addEventListener('click',async()=>{const {error}=await db.auth.signOut();if(error)notify(error.message);else notify('Você saiu da área administrativa.')});
function authUI(){const signed=!!session;$('adminPanel').classList.toggle('hidden',!signed);$('loginForm').classList.toggle('hidden',signed);$('signedIn').classList.toggle('hidden',!signed);$('loginToggle').textContent=signed?'🔓 Administração':'🔐 Área administrativa';render()}
db.auth.onAuthStateChange((_event,s)=>{session=s;authUI()});
(async()=>{const {data}=await db.auth.getSession();session=data.session;authUI();await refresh();channel=db.channel('placar-centos').on('postgres_changes',{event:'*',schema:'public',table:'dividas_salgados'},()=>{refresh()}).subscribe()})();
// Atualização de segurança caso o Realtime não esteja habilitado no projeto.
setInterval(()=>{if(!busy)refresh()},30000);
})();
</script></body></html>
